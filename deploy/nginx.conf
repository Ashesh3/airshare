limit_req_zone $binary_remote_addr zone=airshare_requests:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=airshare_connections:10m;

server {
    listen 80;
    server_name _;
    # Transfer paths contain bearer capabilities; avoid routine URL access logs.
    access_log off;

    client_max_body_size 0;
    client_body_timeout 24h;
    send_timeout 24h;
    limit_req zone=airshare_requests burst=40 nodelay;
    limit_req_status 429;
    limit_conn airshare_connections 64;
    limit_conn_status 429;

    location / {
        # Forward the relay's non-fetching 103 liveness hints as interim responses.
        early_hints 1;
        proxy_pass http://airshare:3070;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        # QR rows and encoded Unicode URLs can exceed nginx's one-page header buffer.
        proxy_buffer_size 64k;
        proxy_buffers 4 64k;
        proxy_busy_buffers_size 128k;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }
}
